<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agrogandh Onion Guide</title>
    <meta
      name="description"
      content="Agrogandh Seeds onion crop guide with production and cultivation details."
    />
    <link rel="canonical" href="https://agrogandhseeds.com/onion-guide.html" />
    <style>
      :root {
        --bg: #f4f2e8;
        --surface: rgba(255, 255, 255, 0.94);
        --surface-soft: #eef5e7;
        --text: #1b1c15;
        --muted: #4d5145;
        --primary: #0c5f23;
        --primary-deep: #093f18;
        --border: rgba(12, 95, 35, 0.12);
        --shadow: 0 24px 60px rgba(13, 34, 11, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top left, rgba(247, 214, 99, 0.3), transparent 28%),
          linear-gradient(180deg, #f9f7ef 0%, var(--bg) 100%);
      }

      .page {
        width: min(1120px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0 56px;
      }

      .hero {
        padding: 28px;
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(12, 95, 35, 0.08);
        color: var(--primary);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 18px 0 12px;
        font-size: clamp(2rem, 4vw, 3.5rem);
        line-height: 1.05;
      }


      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 22px;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 18px;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.18s ease, box-shadow 0.18s ease;
      }

      .button:hover {
        transform: translateY(-1px);
      }

      .button--primary {
        color: #fff;
        background: linear-gradient(135deg, var(--primary), var(--primary-deep));
        box-shadow: 0 14px 30px rgba(12, 95, 35, 0.22);
      }

      .button--soft {
        color: var(--primary-deep);
        background: var(--surface-soft);
        border: 1px solid rgba(12, 95, 35, 0.12);
      }

      .guide {
        margin-top: 22px;
        padding: 18px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: var(--shadow);
      }

      .share-card {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 220px;
        gap: 20px;
        align-items: center;
        margin-top: 22px;
        padding: 22px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: rgba(255, 255, 255, 0.88);
        box-shadow: var(--shadow);
      }

      .share-card h2 {
        margin: 0 0 10px;
        font-size: clamp(1.3rem, 2vw, 1.8rem);
      }

      .share-card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .share-card__qr {
        justify-self: center;
        width: min(100%, 220px);
        padding: 12px;
        border-radius: 20px;
        background: #fff;
        border: 1px solid rgba(12, 95, 35, 0.12);
      }

      .share-card__qr img {
        display: block;
        width: 100%;
        height: auto;
      }

      .guide img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 18px;
      }

      .footer-note {
        margin-top: 18px;
        color: var(--muted);
        font-size: 0.95rem;
        line-height: 1.65;
        text-align: center;
      }

      @media (max-width: 640px) {
        .page {
          width: min(100% - 20px, 1120px);
          padding: 20px 0 28px;
        }

        .hero,
        .guide,
        .share-card {
          padding: 16px;
          border-radius: 20px;
        }

        .share-card {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <p class="eyebrow">Agrogandh Seeds Pvt. Ltd.</p>
        <h1>Onion Guide | कांदा मार्गदर्शक</h1>


        <div class="actions">
          <a class="button button--primary" href="/images/guides/agrogandh-onion-1.jpg" target="_blank" rel="noreferrer">Open Full Guide</a>
          <a class="button button--soft" href="/images/guides/agrogandh-onion-1.jpg" download>Download Guide</a>
        </div>
      </section>

      <section class="share-card">
        <div>
          <h2>Scan This QR Code</h2>
        </div>
       
      </section>

      <figure class="guide">
        <img
          src="/images/guides/agrogandh-onion-1.jpg"
          alt="Agrogandh onion crop guide poster in Marathi"
        />
      </figure>
    </main>
  </body>
</html>
