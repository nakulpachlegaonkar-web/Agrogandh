<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Agrogandh Onion Guide</title>

  <meta
    name="description"
    content="Agrogandh Seeds onion crop guide with production and cultivation details."
  />

  <link rel="canonical" href="https://www.agrogandhseeds.com" />

  <!-- QRCode Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg: #f4f2e8;
      --surface: rgba(255,255,255,.95);
      --surface-soft:#eef5e7;
      --text:#1b1c15;
      --muted:#555;
      --primary:#0c5f23;
      --primary-dark:#093f18;
      --border:rgba(12,95,35,.12);
      --shadow:0 20px 50px rgba(0,0,0,.08);
    }

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
      background:linear-gradient(#faf8ef,#f2f0e7);
      color:var(--text);
    }

    .page{
      width:min(1100px,calc(100% - 30px));
      margin:auto;
      padding:40px 0;
    }

    .hero{
      background:var(--surface);
      border-radius:25px;
      padding:30px;
      box-shadow:var(--shadow);
      border:1px solid var(--border);
    }

    .eyebrow{
      display:inline-block;
      padding:8px 15px;
      border-radius:30px;
      background:#eef7ef;
      color:var(--primary);
      font-weight:700;
      font-size:13px;
      letter-spacing:.08em;
      text-transform:uppercase;
    }

    h1{
      margin:18px 0;
      font-size:48px;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      margin-top:25px;
    }

    .button{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      border-radius:40px;
      padding:14px 24px;
      font-weight:bold;
      transition:.2s;
    }

    .button:hover{
      transform:translateY(-2px);
    }

    .button--primary{
      background:linear-gradient(135deg,var(--primary),var(--primary-dark));
      color:white;
    }

    .button--soft{
      background:var(--surface-soft);
      color:var(--primary);
      border:1px solid var(--border);
    }

    .share-card{
      margin-top:25px;
      display:grid;
      grid-template-columns:1fr 220px;
      gap:30px;
      align-items:center;
      background:var(--surface);
      border-radius:25px;
      padding:25px;
      box-shadow:var(--shadow);
      border:1px solid var(--border);
    }

    .share-card h2{
      margin-top:0;
    }

    .share-card p{
      color:var(--muted);
      line-height:1.7;
    }

    .share-card__qr{
      background:#fff;
      border-radius:20px;
      padding:15px;
      display:flex;
      justify-content:center;
      align-items:center;
      border:1px solid var(--border);
    }

    #qrcode img{
      width:100%;
      height:auto;
    }

    .guide{
      margin-top:25px;
      background:#fff;
      padding:18px;
      border-radius:25px;
      border:1px solid var(--border);
      box-shadow:var(--shadow);
    }

    .guide img{
      width:100%;
      display:block;
      border-radius:18px;
    }

    @media(max-width:700px){

      h1{
        font-size:34px;
      }

      .share-card{
        grid-template-columns:1fr;
      }
    }

  </style>
</head>

<body>

<main class="page">

  <section class="hero">

    <div class="eyebrow">
      Agrogandh Seeds Pvt. Ltd.
    </div>

    <h1>
      Onion Guide | कांदा मार्गदर्शक
    </h1>

    <div class="actions">

      <a
        class="button button--primary"
        href="/images/guides/agrogandh-onion.jpg"
        target="_blank">
        Open Full Guide
      </a>

      <a
        class="button button--soft"
        href="/images/guides/agrogandh-onion.jpg"
        download>
        Download Guide
      </a>

    </div>

  </section>

  <section class="share-card">

    <div>

      <h2>Scan This QR Code</h2>

      <p>
        Scan this QR Code to instantly open the Agrogandh Onion Guide on your mobile.
      </p>

      <p id="guide-url"></p>

    </div>

    <div class="share-card__qr">

      <div id="qrcode"></div>

    </div>

  </section>

  <figure class="guide">

    <img
      src="/images/guides/agrogandh-onion.jpg"
      alt="Agrogandh Onion Guide">

  </figure>

</main>

<script>

const guideURL =
    window.location.origin +
    "/images/guides/agrogandh-onion.jpg";

document.getElementById("guide-url").innerHTML =
"<strong>" + guideURL + "</strong>";

new QRCode(document.getElementById("qrcode"),{
    text:guideURL,
    width:200,
    height:200,
    colorDark:"#0c5f23",
    colorLight:"#ffffff",
    correctLevel:QRCode.CorrectLevel.H
});

</script>

</body>
</html>
